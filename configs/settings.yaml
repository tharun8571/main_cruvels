llm:
  # Finalized candidate from Model_Verification_and_Evaluation_Final_Report:
  # Kimi K2.5 (Moonshot AI) -- reasoning/agent LLM, HIGH PRIORITY status.
  # Moonshot's API is OpenAI-compatible, so provider "moonshot" reuses
  # ChatOpenAI with a custom base_url (see src/llm/model.py).
  # NOTE: the report's sourcing shows kimi-k2.5 has a scheduled sunset --
  # check Moonshot's current model list before deploying; swap the model
  # id here (or via LLM_MODEL env var) if kimi-k2.5 has been retired in
  # favor of a newer K2/K3-family id.
  provider: openrouter
  model: moonshotai/kimi-k2.5
  temperature: 0.0
  max_tokens: 1024

embeddings:
  provider: huggingface
  model: BAAI/bge-small-en-v1.5

retrieval:
  chunk_size: 800
  chunk_overlap: 120
  top_k: 5
  score_threshold: 0.20

ingestion:
  ocr_engine: paddleocr-vl
  supported_extensions: [".pdf", ".txt", ".docx"]
  min_confidence: 0.60

agent:
  max_tool_calls: 4
  fallback_message: "I don't have enough information in the available documents to answer this reliably."

paths:
  raw_data_dir: ./data/raw
  processed_data_dir: ./data/processed
  vectorstore_dir: ./data/vectorstore
  prompts_dir: ./prompts
  eval_dataset: ./eval/eval_dataset.json
